<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יוצר הקריוקי שלי</title>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; padding: 40px 20px; background: #f4f6f8; color: #333; }
        .card { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        input { width: 90%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: left; }
        button { background: #3498db; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2980b9; }
        #status { margin-top: 20px; font-weight: bold; color: #e67e22; }
        .audio-section { margin-top: 25px; display: none; text-align: right; }
        .audio-player { margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h1>🎤 מחולל הקריוקי</h1>
    <p>הדבק קישור לשיר מ-YouTube והפרד את הקול מהמוזיקה!</p>
    
    <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." />
    <br>
    <button onclick="processKaraoke()">הפרד קולות</button>

    <div id="status"></div>

    <div id="results" class="audio-section">
        <div class="audio-player">
            <p><strong>🎸 מוזיקה בלבד (פלייבק / קריוקי):</strong></p>
            <audio id="accompanimentPlayer" controls style="width: 100%;"></audio>
        </div>
        <div class="audio-player">
            <p><strong>🎤 קול שירה בלבד (Vocals):</strong></p>
            <audio id="vocalsPlayer" controls style="width: 100%;"></audio>
        </div>
    </div>
</div>

<script>
    async function processKaraoke() {
        const urlInput = document.getElementById('youtubeUrl').value;
        const statusDiv = document.getElementById('status');
        const resultsDiv = document.getElementById('results');

        if (!urlInput) {
            alert('אנא הדבק קישור מ-YouTube');
            return;
        }

        statusDiv.innerText = '⏳ מעבד את השיר... זה עשוי לקחת 1-2 דקות (הורדה והפרדה)';
        resultsDiv.style.display = 'none';

        try {
            const response = await fetch('https://karaoke-backend-4u9c.onrender.com/process', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput })
            });

            const data = await response.json();

            if (response.ok) {
                statusDiv.innerText = '✅ ההפרדה הושלמה בהצלחה!';
                document.getElementById('accompanimentPlayer').src = 'https://karaoke-backend-4u9c.onrender.com' + data.accompaniment;
                document.getElementById('vocalsPlayer').src = 'https://karaoke-backend-4u9c.onrender.com' + data.vocals;
                resultsDiv.style.display = 'block';
            } else {
                statusDiv.innerText = '❌ שגיאה: ' + (data.detail || 'לא ניתן לעבד את השיר');
            }
        } catch (err) {
            statusDiv.innerText = '❌ שגיאה בהתחברות לשרת';
            console.error(err);
        }
    }
</script>

</body>
</html>
