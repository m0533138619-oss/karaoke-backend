<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחולל קריוקי</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; padding: 40px; }
        .card { background: #1e1e1e; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input[type="file"] { margin: 20px 0; color: #ccc; }
        button { background: #e50914; color: #fff; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; }
        button:disabled { background: #555; }
        .audio-group { margin-top: 25px; text-align: right; }
        audio { width: 100%; margin-top: 8px; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎤 מחולל קריוקי - הפרדת קולות</h2>
        <p>בחר קובץ שיר (MP3 / WAV) מהמחשב או הנייד:</p>
        
        <input type="file" id="audioFile" accept="audio/*">
        <br>
        <button id="submitBtn" onclick="uploadAndProcess()">הפרד קולות</button>

        <div id="status"></div>

        <div id="results" style="display:none;">
            <div class="audio-group">
                <label>🎵 פלייבק (ללא שירה):</label>
                <audio id="accAudio" controls></audio>
            </div>
            <div class="audio-group">
                <label>🎤 שירה בלבד (Vocals):</label>
                <audio id="vocAudio" controls></audio>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://karaoke-backend-80qf.onrender.com"; // ודא שזו כתובת ה-Render שלך

        async function uploadAndProcess() {
            const fileInput = document.getElementById('audioFile');
            const statusDiv = document.getElementById('status');
            const submitBtn = document.getElementById('submitBtn');
            const resultsDiv = document.getElementById('results');

            if (!fileInput.files[0]) {
                alert("אנא בחר קובץ אודיו ראשית");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            submitBtn.disabled = true;
            statusDiv.style.color = "#FFCC00";
            statusDiv.innerText = "מעלה ומפריד קולות... התהליך עשוי לקחת כדקה";
            resultsDiv.style.display = "none";

            try {
                const response = await fetch(`${BACKEND_URL}/process-file`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "שגיאה בריצה");
                }

                document.getElementById('accAudio').src = BACKEND_URL + data.accompaniment;
                document.getElementById('vocAudio').src = BACKEND_URL + data.vocals;

                statusDiv.style.color = "#00FF00";
                statusDiv.innerText = "ההפרדה הושלמה בהצלחה!";
                resultsDiv.style.display = "block";
            } catch (err) {
                statusDiv.style.color = "#FF0000";
                statusDiv.innerText = "❌ שגיאה: " + err.message;
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
